<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Suvera modern tesettur giyim koleksiyonlari, sade ve guclu parcalar ile yeni sezon seckileri." />
  <link rel="canonical" href="https://suvera.com.tr/anasayfa" />
  <meta name="theme-color" content="#2a4827" />
  {{> head-defaults}}
  <title>SUVERA – Modern Tesettür Giyim</title>
  <style>
    :root {
      --bg: #f7f5f1;
      --white: #ffffff;
      --black: #1a1a1a;
      --mid: #4a4a4a;
      --light: #ddd7cd;
      --lighter: #eeebe5;
      --accent: #3d6b38;
      --accent2: #5a8f52;
      --green-dark: #2a4827;
      --copper: #b46a45;
      --marmara: #e9ded1;
      --olive-ink: #20341f;
      --marble: #f4f2ed;
      --serif: 'Cormorant Garamond', serif;
      --sans: 'Jost', sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); background: var(--bg); color: var(--black); overflow-x: hidden; padding-top:102px; }

    /* ANNOUNCEMENT — fixed at very top */
    .announce {
      background: var(--green-dark); color: rgba(255,255,255,.85);
      text-align:center; padding:0 20px;
      font-size:11px; letter-spacing:2px; text-transform:uppercase;
      position:fixed; top:0; left:0; right:0; z-index:301;
      height:38px; display:flex; align-items:center; justify-content:center; gap:22px;
    }
    .announce-link {
      min-width:0; max-width:min(760px, calc(100vw - 120px));
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      color:rgba(255,255,255,.92); text-decoration:none;
    }
    .announce-arrow {
      width:28px; height:28px; border:0; border-radius:50%;
      background:transparent; color:rgba(255,255,255,.76);
      display:grid; place-items:center; cursor:pointer;
      font-size:22px; line-height:1; transition:color .2s ease, background .2s ease;
    }
    .announce-arrow:hover {
      color:#fff; background:rgba(255,255,255,.08);
    }

    /* NAV */
    nav {
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid var(--light);
      position:fixed; top:38px; left:0; right:0; z-index:300;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 48px; height:64px;
      transition: background .4s ease, border-color .35s ease,
                  box-shadow .35s ease, top .35s ease;
    }
    /* Once user scrolls past the announce bar height (38px) */
    nav.scrolled {
      background: var(--white);
      border-bottom-color: var(--light);
      box-shadow: 0 2px 20px rgba(0,0,0,.07);
      top: 0;
    }
    /* Announce bar hides when scrolled */
    .announce.hidden {
      transform: translateY(-100%);
      transition: transform .35s ease;
    }
    .nav-left { display:flex; align-items:center; gap:36px; }
    .nav-logo {
      font-family: var(--serif); font-size:28px; font-weight:600;
      letter-spacing:6px; color:var(--black); text-decoration:none;
      transition: color .35s;
    }
    .nav-menu { display:flex; gap:28px; list-style:none; }
    .nav-menu a {
      font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase;
      font-weight:400; color:var(--black); text-decoration:none;
      position:relative; padding-bottom:3px;
      transition: color .35s;
    }
    .nav-menu a::after {
      content:''; position:absolute; bottom:0; left:0; width:0; height:1px;
      background:var(--accent); transition:width .3s ease;
    }
    .nav-menu a:hover::after { width:100%; }
    nav.scrolled .nav-menu a:hover { color:var(--accent); }
    .nav-menu a.outlet { color:#ffaaaa; }
    nav.scrolled .nav-menu a.outlet { color:#b33a3a; }
    .nav-right { display:flex; align-items:center; gap:22px; }
    /* Search expand */
    .nav-search {
      display:flex; align-items:center; gap:8px;
      max-width:0; overflow:hidden; transition:max-width .3s ease;
    }
    .nav-search.open { max-width:200px; }
    .nav-search input {
      border:none; border-bottom:1px solid var(--light); background:none;
      font-family:var(--sans); font-size:12px; letter-spacing:1px; padding:4px 0;
      width:160px; outline:none; color:var(--black);
      transition: border-color .35s, color .35s;
    }
    .nav-search input::placeholder { color:#aaa; }
    .nav-icon-btn {
      background:none; border:none; cursor:pointer; font-size:12.5px;
      letter-spacing:1.5px; color:var(--black); text-decoration:none;
      position:relative; transition:color .35s;
      font-family: var(--sans);
    }
    .nav-icon-btn:hover { color:var(--accent); opacity:1; }
    .cart-dot {
      position:absolute; top:-5px; right:-7px;
      background:var(--accent2); color:#fff; border-radius:50%;
      width:15px; height:15px; font-size:8px; font-family:var(--sans);
      display:flex; align-items:center; justify-content:center;
    }
    /* Search icon */
    .nav-search-icon {
      background:none; border:none; cursor:pointer;
      color:var(--black); font-size:17px; transition:color .35s;
    }

  /* shared.css handles most nav/mega menu styles */
  /* Page-specific overrides below */

  /* ── HERO SLIDER ── */
    .hero-slider {
      position:relative; width:100%; height:calc(100vh - 102px);
      min-height:620px; overflow:hidden; background:#bfb5a8;
    }

    /* SLIDES */
    .slide {
      position:absolute; inset:0; opacity:0;
      transition:opacity 1.2s cubic-bezier(.4,0,.2,1);
      pointer-events:none; overflow:hidden;
    }
    .slide.active { opacity:1; pointer-events:auto; }

    /* Full-bleed background photo */
    .slide-bg {
      position:absolute; inset:0;
      background-size:cover; background-position:center;
      transform:scale(1.04); transition:transform 8s ease;
    }
    .slide.active .slide-bg { transform:scale(1); }

    /* Slide bg placeholder colors */
    .slide:nth-child(1) .slide-bg {
      background-image:
        linear-gradient(90deg, rgba(247,245,241,.92) 0%, rgba(247,245,241,.72) 34%, rgba(247,245,241,.12) 62%),
        url('assets/suvera-istanbul-editorial-1200.webp');
      background-image:
        linear-gradient(90deg, rgba(247,245,241,.92) 0%, rgba(247,245,241,.72) 34%, rgba(247,245,241,.12) 62%),
        image-set(
          url('assets/suvera-istanbul-editorial-1200.avif') type('image/avif') 1x,
          url('assets/suvera-istanbul-editorial-1200.webp') type('image/webp') 1x,
          url('assets/suvera-istanbul-editorial-1200.webp') type('image/webp') 1x
        );
      background-position:center;
    }
    .slide:nth-child(2) .slide-bg { background:linear-gradient(135deg,#ded4c7,#b7bfa7); }
    .slide:nth-child(3) .slide-bg { background:linear-gradient(135deg,#eadfd2,#c2a489); }
    .slide:nth-child(4) .slide-bg { background:linear-gradient(135deg,#c6cfc0,#8ea184); }

    /* Center gradient for text legibility */
    .slide-overlay {
      position:absolute; inset:0;
      background:
        linear-gradient(180deg, rgba(32,52,31,.05) 0%, rgba(32,52,31,.20) 100%),
        radial-gradient(ellipse 70% 75% at 25% 50%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%);
    }

    /* ── MODELS LEFT & RIGHT ── */
    .slide-models {
      position:absolute; inset:0;
      display:flex; align-items:flex-end; justify-content:space-between;
      pointer-events:none; opacity:.10; mix-blend-mode:multiply;
    }
    .model-left, .model-right {
      font-family:var(--serif); font-size:clamp(120px,15vw,230px); line-height:1;
      color:var(--olive-ink); filter:none; letter-spacing:.08em;
    }
    .model-left {
      transform:translateX(-18px);
      animation:modelLeft 1s cubic-bezier(.22,1,.36,1) both;
    }
    .model-right {
      transform:translateX(18px);
      animation:modelRight 1s cubic-bezier(.22,1,.36,1) both;
      animation-delay:.1s;
    }
    @keyframes modelLeft {
      from { transform:translateX(-50px); opacity:0; }
      to   { transform:translateX(-18px); opacity:1; }
    }
    @keyframes modelRight {
      from { transform:translateX(50px);  opacity:0; }
      to   { transform:translateX(18px);  opacity:1; }
    }

    /* ── CENTER TEXT ── */
    .slide-content {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:flex-start; justify-content:center;
      text-align:left; color:#1a1a1a; padding:0 56% 0 7vw;
      animation:contentIn 1s cubic-bezier(.22,1,.36,1) both;
      animation-delay:.2s;
    }
    @keyframes contentIn {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .slide-tag {
      font-size:11px; letter-spacing:3px; text-transform:uppercase;
      color:var(--copper); margin-bottom:18px; font-weight:500;
    }

    .slide-title {
      font-family:var(--serif); font-weight:300; line-height:1.08;
      font-size:clamp(44px, 5.8vw, 86px); margin-bottom:18px; color:#151515;
      max-width:680px;
    }
    .slide-title em { font-style:italic; color:var(--accent); }
    .slide-title strong { font-weight:600; }

    /* Campaign promo — Fahhar "3 AL 2 ÖDE" style */
    .slide-promo-big {
      margin-bottom:18px;
    }
    .slide-promo-big .promo-cat {
      font-size:12px; letter-spacing:3px; text-transform:uppercase;
      color:rgba(30,30,30,.6); margin-bottom:10px;
    }
    .slide-promo-big .promo-deal {
      font-family:var(--serif); font-size:clamp(42px,6vw,80px);
      font-weight:300; line-height:1; color:#1a1a1a; letter-spacing:-1px;
    }
    .slide-promo-big .promo-deal strong { font-weight:700; }
    .slide-promo-big .promo-note {
      font-size:11px; color:rgba(30,30,30,.5); margin-top:10px; letter-spacing:.5px;
    }

    /* Percent pair */
    .slide-pct-pair {
      display:flex; gap:0; justify-content:center; margin-bottom:20px; align-items:stretch;
    }
    .pct-col { padding:12px 28px; text-align:center; }
    .pct-col + .pct-col { border-left:1px solid rgba(30,30,30,.2); }
    .pct-col small { display:block; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(30,30,30,.55); margin-bottom:3px; }
    .pct-col .pct-num { font-family:var(--serif); font-size:clamp(38px,5vw,68px); font-weight:300; line-height:1; color:#1a1a1a; }
    .pct-col .pct-sign { font-size:.45em; vertical-align:super; }
    .pct-label { font-family:var(--serif); font-size:clamp(22px,3vw,36px); font-weight:300; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }

    .slide-desc {
      font-size:15px; line-height:1.85; color:rgba(30,30,30,.72);
      margin-bottom:28px; font-weight:300; max-width:440px;
    }

    .hero-market-proof {
      display:flex; flex-wrap:wrap; gap:10px; margin-bottom:30px;
    }
    .hero-market-proof span {
      border:1px solid rgba(32,52,31,.16); background:rgba(255,255,255,.62);
      backdrop-filter:blur(8px); padding:8px 12px; font-size:10.5px;
      letter-spacing:1.4px; text-transform:uppercase; color:#4c493f;
    }
    .slide-ctas { display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; }
    .btn-slide-primary {
      background:rgba(26,26,26,.9); color:#fff;
      border:1.5px solid rgba(26,26,26,.9);
      padding:12px 30px; font-family:var(--sans); font-size:11px;
      letter-spacing:2px; text-transform:uppercase; cursor:pointer;
      text-decoration:none; display:inline-block; transition:all .25s;
    }
    .btn-slide-primary:hover { background:var(--accent); border-color:var(--accent); }
    .btn-slide-outline {
      background:rgba(255,255,255,.5); color:#1a1a1a;
      border:1.5px solid rgba(26,26,26,.28);
      padding:12px 30px; font-family:var(--sans); font-size:11px;
      letter-spacing:2px; text-transform:uppercase; cursor:pointer;
      text-decoration:none; display:inline-block; transition:all .25s;
    }
    .btn-slide-outline:hover { border-color:#1a1a1a; }

    /* ARROWS — Fahhar style: simple chevrons */
    .slider-arrow {
      position:absolute; top:50%; transform:translateY(-50%);
      width:40px; height:40px; background:rgba(255,255,255,.6);
      backdrop-filter:blur(4px); border:none;
      color:#1a1a1a; font-size:16px; cursor:pointer; z-index:20;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s; border-radius:50%;
    }
    .slider-arrow:hover { background:rgba(255,255,255,.9); }
    .slider-arrow.prev { left:20px; }
    .slider-arrow.next { right:20px; }

    /* DOTS — Fahhar: small circles */
    .slider-dots {
      position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
      display:flex; gap:8px; z-index:20; align-items:center;
    }
    .slider-dot {
      width:8px; height:8px; border-radius:50%;
      background:rgba(26,26,26,.25);
      cursor:pointer; transition:all .35s ease; border:none; padding:0;
    }
    .slider-dot.active { background:rgba(26,26,26,.8); transform:scale(1.3); }

    /* PROGRESS BAR — transition controlled via JS */
    .slider-progress {
      position:absolute; bottom:0; left:0; height:2px;
      background:rgba(26,26,26,.4); z-index:20; width:0%;
    }

    /* Responsive */
    @media(max-width:900px) {
      .slide-content { padding:0 42% 0 6vw; }
      .model-left, .model-right { font-size:clamp(80px,12vw,150px); }
    }
    @media(max-width:600px) {
      body { padding-top:92px; }
      .hero-slider { height:auto; min-height:520px; }
      .slide:nth-child(1) .slide-bg {
        background-image:
          linear-gradient(180deg, rgba(247,245,241,.96) 0%, rgba(247,245,241,.80) 44%, rgba(247,245,241,.34) 100%),
          url('assets/suvera-istanbul-editorial.png');
        background-image:
          linear-gradient(180deg, rgba(247,245,241,.96) 0%, rgba(247,245,241,.80) 44%, rgba(247,245,241,.34) 100%),
          image-set(
            url('assets/suvera-istanbul-editorial-800.avif') type('image/avif') 1x,
            url('assets/suvera-istanbul-editorial-800.webp') type('image/webp') 1x,
            url('assets/suvera-istanbul-editorial.png') type('image/png') 1x
          );
        background-position:62% center;
      }
      .slide-overlay {
        background:linear-gradient(180deg, rgba(247,245,241,.10) 0%, rgba(247,245,241,.22) 100%);
      }
      .slide-content {
        padding:42px 24px 92px;
        justify-content:flex-start;
        max-width:100%;
      }
      .model-left, .model-right {
        font-size:clamp(52px,14vw,86px);
        opacity:.22;
      }
      .slide-tag {
        font-size:10px;
        letter-spacing:2.4px;
        margin-bottom:14px;
      }
      .slide-title {
        font-size:clamp(36px,10vw,46px);
        line-height:1.02;
        margin-bottom:14px;
      }
      .slide-desc {
        max-width:330px;
        font-size:14px;
        line-height:1.65;
        margin-bottom:18px;
      }
      .hero-market-proof {
        gap:8px;
        margin-bottom:22px;
        max-width:330px;
      }
      .hero-market-proof span {
        background:rgba(255,255,255,.82);
        padding:7px 10px;
        font-size:9.5px;
        letter-spacing:1.1px;
      }
      .slide-ctas {
        display:grid;
        grid-template-columns:1fr;
        gap:8px;
        width:min(100%,330px);
      }
      .btn-slide-primary,
      .btn-slide-outline {
        width:100%;
        text-align:center;
        padding:12px 16px;
        font-size:10.5px;
      }
      .slider-arrow {
        top:auto;
        bottom:58px;
        width:38px;
        height:38px;
      }
      .slider-arrow.prev { left:24px; }
      .slider-arrow.next { right:24px; }
      .slider-dots { bottom:28px; }
    }

    /* EXISTING BTNS (kept for other sections) */
    .btn-dark {
      background:var(--black); color:#fff; border:none; padding:14px 36px;
      font-family:var(--sans); font-size:11.5px; letter-spacing:2px;
      text-transform:uppercase; cursor:pointer; text-decoration:none;
      display:inline-block; transition:background .25s, transform .2s;
    }
    .btn-dark:hover { background:var(--accent); transform:translateY(-2px); }
    .btn-ghost {
      background:transparent; color:var(--black); border:1px solid var(--black);
      padding:14px 36px; font-family:var(--sans); font-size:11.5px;
      letter-spacing:2px; text-transform:uppercase; cursor:pointer;
      text-decoration:none; display:inline-block; transition:all .25s;
    }
    .btn-ghost:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }

    /* MARQUEE */
    .marquee-wrap {
      background:var(--olive-ink); overflow:hidden; padding:14px 0; white-space:nowrap;
    }
    .marquee-track {
      display:inline-block; animation:marquee 22s linear infinite;
    }
    .marquee-track span {
      font-size:11px; letter-spacing:3px; text-transform:uppercase;
      color:rgba(255,255,255,.55); margin-right:48px;
    }
    .marquee-track span.dot { color:var(--copper); margin-right:48px; }
    @keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    /* SECTION COMMON */
    section { padding:88px 64px; }
    .sec-head {
      display:flex; justify-content:space-between; align-items:flex-end;
      margin-bottom:48px;
    }
    .sec-title {
      font-family:var(--serif); font-size:42px; font-weight:300; line-height:1.2;
    }
    .sec-title em { font-style:italic; color:var(--accent); }
    .sec-sub { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#999; margin-bottom:6px; }
    .link-arrow {
      font-size:11.5px; letter-spacing:2px; text-transform:uppercase;
      color:var(--mid); text-decoration:none; border-bottom:1px solid var(--mid);
      padding-bottom:2px; transition:all .2s;
    }
    .link-arrow:hover { color:var(--accent); border-color:var(--accent); }

    /* CATEGORIES */
    .cats-bg { background:var(--white); }
    .cats-grid { display:grid; grid-template-columns:2fr 1fr 1fr; gap:3px; }
    .cat-card {
      position:relative; overflow:hidden; cursor:pointer; min-height:280px;
    }
    .cat-card:nth-child(1) { grid-row:span 2; }
    .cat-inner {
      width:100%; height:100%; min-height:280px;
      display:flex; align-items:center; justify-content:center;
      font-family:var(--serif); font-size:clamp(48px,7vw,96px);
      letter-spacing:.08em; color:rgba(255,255,255,.70); transition:transform .6s ease;
      text-transform:uppercase;
    }
    .cat-card:hover .cat-inner { transform:scale(1.04); }
    .cat-inner::before {
      content:''; position:absolute; inset:0;
      background:
        linear-gradient(135deg, rgba(255,255,255,.10), transparent 36%),
        radial-gradient(circle at 78% 18%, rgba(255,255,255,.18), transparent 22%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 1px, transparent 1px 18px);
    }
    .cat-card:nth-child(1) .cat-inner { background:linear-gradient(150deg,#315b3a,#1f321e); min-height:100%; }
    .cat-card:nth-child(2) .cat-inner { background:linear-gradient(150deg,#d9c8b4,#a56f4f); }
    .cat-card:nth-child(3) .cat-inner { background:linear-gradient(150deg,#829772,#3d6b38); }
    .cat-card:nth-child(4) .cat-inner { background:linear-gradient(150deg,#eee4d7,#b9aa91); }
    .cat-card:nth-child(5) .cat-inner { background:linear-gradient(150deg,#425f63,#263f43); }
    .cat-inner.has-image { background-repeat:no-repeat; background-size:cover; background-position:center; }
    .cat-overlay {
      position:absolute; bottom:0; left:0; right:0;
      background:linear-gradient(to top, rgba(0,0,0,.64) 0%, transparent 100%);
      padding:28px 24px 20px; color:#fff;
    }
    .cat-overlay h3 { font-family:var(--serif); font-size:22px; font-weight:300; margin-bottom:4px; }
    .cat-overlay p { font-size:10.5px; letter-spacing:1.5px; opacity:.75; }

    /* PRODUCTS */
    .prods-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; }
    .prod-card {
      position:relative; cursor:pointer; background:var(--white);
      transition:transform .3s; overflow:hidden;
    }
    .prod-card:hover { transform:translateY(-4px); z-index:2; box-shadow:0 12px 40px rgba(0,0,0,.1); }
    .prod-img {
      aspect-ratio:3/4; background:var(--lighter);
      display:flex; align-items:center; justify-content:center;
      font-size:64px; position:relative; overflow:hidden;
    }
    .prod-img > span {
      font-family:var(--serif); font-size:clamp(34px,4vw,58px);
      color:rgba(32,52,31,.54); letter-spacing:.12em; text-transform:uppercase;
    }
    .prod-img::after {
      content:''; position:absolute; inset:16px; border:1px solid rgba(255,255,255,.42);
      pointer-events:none;
    }
    .prod-img-bg { width:100%; height:100%; position:absolute; inset:0; transition:transform .6s ease; }
    .prod-card:hover .prod-img-bg { transform:scale(1.05); }
    .prod-badges { position:absolute; top:12px; left:12px; display:flex; flex-direction:column; gap:5px; }
    .badge {
      font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase;
      padding:4px 10px; font-family:var(--sans);
    }
    .badge-sale { background:var(--accent); color:#fff; }
    .badge-new { background:var(--black); color:#fff; }
    .badge-soon { background:#fff; color:var(--black); border:1px solid var(--black); }
    .prod-hover-actions {
      position:absolute; bottom:0; left:0; right:0;
      background:rgba(255,255,255,.95); padding:12px 16px;
      transform:translateY(100%); transition:transform .3s ease;
      display:flex; align-items:center; gap:10px;
    }
    .prod-card:hover .prod-hover-actions { transform:translateY(0); }
    .quick-add {
      flex:1; background:var(--black); color:#fff; border:none;
      font-family:var(--sans); font-size:10.5px; letter-spacing:2px;
      text-transform:uppercase; padding:10px; cursor:pointer;
      transition:background .2s;
    }
    .quick-add:hover { background:var(--accent); }
    .fav-btn {
      width:38px; height:38px; border:1px solid var(--light);
      background:#fff; cursor:pointer; font-size:15px;
      display:flex; align-items:center; justify-content:center;
      transition:border-color .2s;
    }
    .fav-btn:hover { border-color:var(--accent); }
    .prod-info { padding:14px 16px 20px; }
    .prod-info h4 { font-family:var(--serif); font-size:16px; font-weight:400; margin-bottom:5px; line-height:1.3; }
    .prod-colors { display:flex; gap:5px; margin-bottom:10px; }
    .color-dot {
      width:14px; height:14px; border-radius:50%; border:1.5px solid transparent;
      cursor:pointer; transition:border-color .2s;
    }
    .color-dot:hover, .color-dot.active { border-color:var(--black); }
    .prod-price { display:flex; gap:10px; align-items:baseline; }
    .p-new { font-size:14.5px; font-weight:500; }
    .p-old { font-size:12.5px; color:#aaa; text-decoration:line-through; }
    .p-pct { font-size:11px; color:var(--accent); font-weight:500; }

    /* EDITORIAL BANNER */
    .editorial {
      margin:0 64px; background:linear-gradient(135deg,#20341f 0%, #315b3a 100%); padding:80px;
      display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center;
    }
    .ed-text p { font-size:10.5px; letter-spacing:3px; text-transform:uppercase; color:var(--accent2); margin-bottom:20px; }
    .ed-title { font-family:var(--serif); font-size:52px; font-weight:300; line-height:1.15; margin-bottom:24px; color:#fff; }
    .ed-title em { font-style:italic; color:var(--accent2); }
    .ed-body { font-size:14px; line-height:1.9; color:rgba(255,255,255,.65); margin-bottom:36px; font-weight:300; }
    .ed-img {
      aspect-ratio:4/5;
      background-image:
        linear-gradient(180deg, rgba(32,52,31,0) 44%, rgba(32,52,31,.62) 100%),
        url('assets/suvera-istanbul-editorial.png');
      background-image:
        linear-gradient(180deg, rgba(32,52,31,0) 44%, rgba(32,52,31,.62) 100%),
        image-set(
          url('assets/suvera-istanbul-editorial-800.avif') type('image/avif') 1x,
          url('assets/suvera-istanbul-editorial-800.webp') type('image/webp') 1x,
          url('assets/suvera-istanbul-editorial.png') type('image/png') 1x
        );
      background-position:center;
      background-size:cover;
      display:flex; align-items:center; justify-content:center; font-size:80px;
      position:relative;
    }
    .ed-img-caption {
      position:absolute; bottom:24px; right:24px;
      background:#fff; padding:12px 18px; border-left:2px solid var(--accent2);
    }
    .ed-img-caption strong { font-family:var(--serif); font-size:16px; display:block; }
    .ed-img-caption small { font-size:10.5px; color:#999; letter-spacing:1px; }

    /* NEWSLETTER */
    .newsletter {
      background:var(--green-dark); padding:72px 64px; text-align:center;
    }
    .newsletter p { font-size:10.5px; letter-spacing:3px; text-transform:uppercase; color:var(--accent2); margin-bottom:16px; }
    .newsletter h2 { font-family:var(--serif); font-size:48px; font-weight:300; color:#fff; margin-bottom:12px; }
    .newsletter h2 em { font-style:italic; color:var(--accent2); }
    .newsletter span { font-size:13.5px; color:rgba(255,255,255,.5); display:block; margin-bottom:36px; }
    .nl-form { display:flex; gap:0; justify-content:center; max-width:480px; margin:0 auto; }
    .nl-form input {
      flex:1; padding:14px 20px; border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.06); color:#fff; font-family:var(--sans);
      font-size:13px; outline:none;
    }
    .nl-form input::placeholder { color:rgba(255,255,255,.35); }
    .nl-form button {
      background:var(--accent2); color:#fff; border:none; padding:14px 28px;
      font-family:var(--sans); font-size:11px; letter-spacing:2px;
      text-transform:uppercase; cursor:pointer; transition:background .2s; white-space:nowrap;
    }
    .nl-form button:hover { background:var(--accent); }
    .kvkk-check { margin-top:14px; display:flex; align-items:center; justify-content:center; gap:8px; }
    .kvkk-check input { width:14px; height:14px; accent-color:var(--accent); }
    .kvkk-check label { font-size:11.5px; color:rgba(255,255,255,.45); }
    .kvkk-check a { color:rgba(255,255,255,.65); }

    /* FOOTER */
    footer { background:var(--green-dark); padding:0 64px 32px; }
    .footer-divider { border:none; border-top:1px solid rgba(255,255,255,.08); margin-bottom:56px; }
    .footer-grid { display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr 1fr; gap:48px; margin-bottom:56px; }
    .footer-brand .nav-logo { color:#fff; display:block; margin-bottom:18px; }
    .footer-brand p { font-size:12.5px; line-height:1.9; color:rgba(255,255,255,.4); font-weight:300; margin-bottom:28px; }
    .socials { display:flex; gap:10px; }
    .social-btn {
      font-size:11.5px; letter-spacing:1px; color:rgba(255,255,255,.55);
      text-decoration:none; transition:color .2s; font-weight:400;
    }
    .social-btn:hover { color:var(--accent2); }
    .footer-col h5 { font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:#fff; margin-bottom:22px; }
    .footer-col ul { list-style:none; }
    .footer-col ul li { margin-bottom:11px; }
    .footer-col ul li a { font-size:13px; color:rgba(255,255,255,.45); text-decoration:none; transition:color .2s; font-weight:300; }
    .footer-col ul li a:hover { color:var(--accent2); }
    .footer-bottom {
      border-top:1px solid rgba(255,255,255,.07); padding-top:24px;
      display:flex; justify-content:space-between; align-items:center;
      font-size:11.5px; color:rgba(255,255,255,.3);
    }
    .pay-icons { display:flex; gap:8px; }
    .pay-pill {
      padding:3px 10px; border:1px solid rgba(255,255,255,.15);
      font-size:10px; letter-spacing:1px; color:rgba(255,255,255,.4);
    }

    /* FEATURES BAR */
    .features-bar {
      display:grid; grid-template-columns:repeat(4,1fr);
      border-top:1px solid var(--light); border-bottom:1px solid var(--light);
      background:var(--white);
    }
    .feat {
      padding:32px 28px; text-align:center;
      border-right:1px solid var(--light);
    }
    .feat:last-child { border-right:none; }
    .feat-icon { font-size:22px; margin-bottom:10px; }
    .feat h4 { font-family:var(--serif); font-size:16px; font-weight:400; margin-bottom:5px; }
    .feat p { font-size:12px; color:#888; line-height:1.6; }

    /* SCROLL REVEAL */
    .reveal { opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; }
    .reveal.show { opacity:1; transform:translateY(0); }

    /* RESPONSIVE */
    @media(max-width:1100px) {
      .prods-grid { grid-template-columns:repeat(3,1fr); }
      .cats-grid { grid-template-columns:1fr 1fr; }
      .cat-card:nth-child(1) { grid-row:auto; }
      .footer-grid { grid-template-columns:1fr 1fr 1fr; }
    }
    @media(max-width:768px) {
      nav { padding:0 20px; }
      .nav-menu, .nav-search { display:none; }
      section { padding:56px 20px; }
      .hero { grid-template-columns:1fr; }
      .hero-right { padding:48px 24px; }
      .prods-grid { grid-template-columns:repeat(2,1fr); }
      .cats-grid { grid-template-columns:1fr 1fr; }
      .editorial { margin:0 20px; padding:40px 28px; grid-template-columns:1fr; }
      .features-bar { grid-template-columns:1fr 1fr; }
      footer { padding:0 20px 24px; }
      .footer-grid { grid-template-columns:1fr 1fr; }
    }
    @media(max-width:600px) {
      section { padding:48px 18px; }
      .sec-head {
        display:grid;
        gap:14px;
        margin-bottom:28px;
      }
      .sec-title {
        font-size:clamp(34px,10vw,42px);
      }
      .cats-grid {
        grid-template-columns:1fr;
        gap:8px;
      }
      .cat-card,
      .cat-inner {
        min-height:190px;
      }
      .cat-inner {
        font-size:clamp(42px,14vw,64px);
      }
      .prods-grid {
        gap:8px;
      }
      .prod-info {
        padding:12px 10px 16px;
      }
      .prod-info h4 {
        font-size:15px;
      }
      .editorial {
        margin:0;
        padding:38px 22px;
        gap:28px;
      }
      .ed-title,
      .newsletter h2 {
        font-size:clamp(34px,10vw,42px);
      }
      .newsletter {
        padding:52px 20px;
      }
      .nl-form {
        display:grid;
        gap:10px;
      }
      .nl-form input,
      .nl-form button {
        width:100%;
      }
      .features-bar {
        grid-template-columns:1fr;
      }
      .feat {
        padding:24px 20px;
        border-right:none;
        border-bottom:1px solid var(--light);
      }
    }
  </style>
  <link rel="stylesheet" href="css/home.css" />
</head>

{{> navigation}}

<main id="main" tabindex="-1">
<h1 class="sr-only">Suvera</h1>
<div id="homepageSections" class="homepage-sections" aria-live="polite"></div>

<!-- FOOTER -->
</main>

{{> footer}}
{{> consent}}
<script>

  // Favori toggle (emoji in JS is safe here)
  function toggleFav(btn) {
    const isFav = btn.classList.toggle('active');
    btn.textContent = isFav ? '♥' : '♡';
    if(window.Suvera) Suvera.toast(isFav ? 'Favorilere eklendi' : 'Favorilerden çıkarıldı', isFav ? 'green' : 'dark');
  }

  // ── SLIDER ──
  // Scope everything to the slider container to avoid class conflicts
  const INTERVAL = 5000; // 5 saniye

  let cur = 0;
  let timer = null;
  let sliderBound = false;

  function sliderNode() { return document.getElementById('heroSlider'); }
  function progressNode() { return document.getElementById('sliderProgress'); }

  function getSlides() {
    const slider = sliderNode();
    return slider ? Array.from(slider.querySelectorAll(':scope > .slide')) : [];
  }

  function getDots() {
    return Array.from(document.querySelectorAll('#heroSliderDots .slider-dot'));
  }

  function showSlide(idx) {
    const slides = getSlides();
    const dots = getDots();
    if(!slides.length) return;
    idx = ((idx % slides.length) + slides.length) % slides.length;

    // hide all, show target
    slides.forEach((s, i) => {
      s.classList.toggle('active', i === idx);
    });
    dots.forEach((d, i) => {
      d.classList.toggle('active', i === idx);
    });
    cur = idx;
    startProgress();
  }

  function startProgress() {
    const PROGRESS = progressNode();
    if(!PROGRESS) return;
    PROGRESS.style.transition = 'none';
    PROGRESS.style.width = '0%';
    // force reflow
    PROGRESS.getBoundingClientRect();
    PROGRESS.style.transition = 'width ' + INTERVAL + 'ms linear';
    PROGRESS.style.width = '100%';
  }

  function next() { showSlide(cur + 1); }
  function prev() { showSlide(cur - 1); }

  // make arrow funcs global for onclick
  window.changeSlide = function(dir) {
    stopTimer();
    showSlide(cur + dir);
    startTimer();
  };
  window.goSlide = function(idx) {
    stopTimer();
    showSlide(idx);
    startTimer();
  };

  function startTimer() {
    stopTimer();
    if(getSlides().length < 2) return;
    timer = setInterval(next, INTERVAL);
  }
  function stopTimer() {
    if(timer) { clearInterval(timer); timer = null; }
  }

  // scroll reveal handled by shared.js

  window.rebuildHeroSlider = function() {
    const slider = sliderNode();
    if (!slider) return;
    if (!sliderBound) {
      slider.addEventListener('mouseenter', () => {
        stopTimer();
        const progress = progressNode();
        if(progress) progress.style.transition='none';
      });
      slider.addEventListener('mouseleave', () => { startProgress(); startTimer(); });
      let touchX = 0;
      slider.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive:true});
      slider.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchX;
        if(Math.abs(dx) > 40) window.changeSlide(dx < 0 ? 1 : -1);
      }, {passive:true});
      sliderBound = true;
    }
    cur = 0;
    stopTimer();
    showSlide(0);
    startTimer();
  };

</script>

<script type="module" src="js/storefront.js"></script>
</body>
