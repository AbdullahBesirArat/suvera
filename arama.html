<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arama | SUVERA</title>
  <meta name="description" content="Suvera urunleri icinde arama yapin ve ilgili sonuclari goruntuleyin." />
  <link rel="canonical" href="https://suvera.com.tr/arama" />
    {{> head-defaults}}<link rel="stylesheet" href="css/site-pages.css" />
</head>
<body class="site-page-body">
  {{> announcement}}
  {{> navigation}}

  <main id="main" tabindex="-1" class="info-page-shell" data-page-root="searchPage">
    <div class="page-breadcrumb"><a href="anasayfa">Ana Sayfa</a><span>›</span><span>Arama</span></div>
    <section class="page-hero">
      <div class="page-hero-card">
        <div class="hero-kicker">Arama Sonuclari</div>
        <h1 class="hero-title">Aradiginiz ifade:<br/><span id="searchQueryLabel">Tum secki</span></h1>
        <p class="page-copy">Katalogda isim, kategori, etiket ve aciklama alanlarina gore arama yapabilirsiniz.</p>
      </div>
      <aside class="page-side-card">
        <form class="page-form" id="searchForm">
          <label for="searchInput">Yeni arama</label>
          <input id="searchInput" type="search" placeholder="Ornek: ferace, trenckot, tunik" />
          <div class="page-form-grid search-filter-grid">
            <div>
              <label for="searchCategory">Kategori</label>
              <select id="searchCategory" name="category">
                <option value="">Tum kategoriler</option>
              </select>
            </div>
            <div>
              <label for="searchColor">Renk</label>
              <select id="searchColor" name="color">
                <option value="">Tum renkler</option>
              </select>
            </div>
            <div>
              <label for="searchSize">Beden</label>
              <select id="searchSize" name="size">
                <option value="">Tum bedenler</option>
              </select>
            </div>
            <div>
              <label for="searchMinPrice">Min. fiyat</label>
              <input id="searchMinPrice" name="min_price" type="number" min="0" step="1" placeholder="0" />
            </div>
            <div>
              <label for="searchMaxPrice">Maks. fiyat</label>
              <input id="searchMaxPrice" name="max_price" type="number" min="0" step="1" placeholder="5000" />
            </div>
          </div>
          <div class="page-form-actions">
            <button type="submit" class="page-btn">Ara</button>
            <a class="page-btn-secondary" href="arama">Temizle</a>
          </div>
        </form>
        <div class="page-pill-row"><div class="page-pill">Sonuc sayisi: <span id="searchResultCount">0</span></div></div>
      </aside>
    </section>

    <section class="page-card">
      <div class="page-section-head">
        <h2 class="page-section-title">Eslesen Urunler</h2>
        <span class="page-section-subtitle">Canli katalog</span>
      </div>
      <div id="searchResultsGrid" class="page-result-grid"></div>
    </section>
  </main>

  {{> footer}}
{{> consent}}

    {{> scripts}}<script type="module" src="js/site-pages.js"></script>
  </body>
</html>
